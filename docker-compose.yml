version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ../eeg-mi-bci:/app/eeg-mi-bci:ro
      - ../eeg-mi-bci-archive-565657a:/app/eeg-mi-bci-archive-565657a:ro
      - ../figures:/app/figures:ro
      - ../reports:/app/reports:ro
    environment:
      - NEUROMOVE_ROOT=/app
      - NEUROMOVE_PIP_PACKAGES=/app/.venv/lib/python3.11/site-packages
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

