[project]
name = "eeg-minirocket-project"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0,<2.6.0",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.10.0,<1.19.0",
    "matplotlib>=3.7.0",
    "mne>=1.5.0",
    "scikit-learn>=1.3.0,<1.9.0",
    "sktime>=0.24.0",
    "numba>=0.59.0",
    "torch>=2.0.0",
    "streamlit>=1.28.0",
    "streamlit-option-menu>=0.3.6",
    "streamlit-lottie>=0.0.3",
    "seaborn>=0.12.0",
    "edfio>=0.4.0",
    "plotly>=5.0.0",
    "Pillow>=9.0.0",
    "joblib>=1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["eeg-mi-bci", "scripts", "neuro-move-release/backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "PDF", "PGH", "PLC", "PLE", "PLR", "PLW", "TRY", "DTZ", "G", "LOG"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["src", "neuromove"]

[tool.ruff.format]
style = "pegasus"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
