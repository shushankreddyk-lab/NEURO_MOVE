version: '3.8'

# =============================================================================
# NeuroMove Enterprise MI-BCI - Production Docker Compose
# Services: API, Dashboard, MLflow, Prometheus, Grafana, PostgreSQL, Redis
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # NeuroMove API - FastAPI production server
  # ---------------------------------------------------------------------------
  neuromove-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: neuromove/api:latest
    container_name: neuromove-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEUROMOVE_ROOT=/app
      - MLFLOW_TRACKING_URI=file:/app/mlruns
      - MLFLOW_REGISTRY_URI=file:/app/mlruns
      - API_KEY_ADMIN=${API_KEY_ADMIN:-neuromove-enterprise}
      - API_KEY_CLIENT=${API_KEY_CLIENT:-neuromove-client}
      - LOG_LEVEL=INFO
      # Cloudflare Turnstile
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-true}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - TURNSTILE_FAIL_OPEN=${TURNSTILE_FAIL_OPEN:-false}
      # Rate Limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-100/minute}
    volumes:
      - neuromove_models:/app/models
      - neuromove_artifacts:/app/artifacts
      - neuromove_logs:/app/logs
      - neuromove_mlruns:/app/mlruns
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - neuromove-network
    depends_on:
      - postgres
      - redis

  # ---------------------------------------------------------------------------
  # NeuroMove Dashboard - Streamlit
  # ---------------------------------------------------------------------------
  neuromove-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: neuromove/dashboard:latest
    container_name: neuromove-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - NEUROMOVE_ROOT=/app
      - NEUROMOVE_PIP_PACKAGES=
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - neuromove_models:/app/models
      - neuromove_artifacts:/app/artifacts
      - neuromove_logs:/app/logs
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - neuromove-network
    depends_on:
      - neuromove-api

  # ---------------------------------------------------------------------------
  # MLflow Tracking Server
  # ---------------------------------------------------------------------------
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: neuromove/mlflow:latest
    container_name: neuromove-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow/mlflow.db
      - MLFLOW_ARTIFACT_ROOT=/app/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /app/mlruns
      --workers 2
    volumes:
      - neuromove_mlruns:/app/mlruns
      - ./mlflow:/app/mlflow:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - neuromove-network

  # ---------------------------------------------------------------------------
  # PostgreSQL - For MLflow backend (production)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: neuromove-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=neuromove
      - POSTGRES_USER=neuromove
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-neuromove_secure_pass}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - neuromove_postgres:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuromove -d neuromove"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - neuromove-network

  # ---------------------------------------------------------------------------
  # Redis - Caching & Session Store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: neuromove-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - neuromove_redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - neuromove-network

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: neuromove-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - neuromove_prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - neuromove-network

  # ---------------------------------------------------------------------------
  # Grafana - Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.1.0
    container_name: neuromove-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-neuromove_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - neuromove_grafana:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/neuromove.json:ro
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - neuromove-network
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # Node Exporter - Host Metrics
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: neuromove-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - neuromove-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ---------------------------------------------------------------------------
  # cAdvisor - Container Metrics
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: neuromove-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--storage_duration=300s'
    networks:
      - neuromove-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Alertmanager - Alerting
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: neuromove-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - neuromove_alertmanager:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - neuromove-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  neuromove_models:
    driver: local
  neuromove_artifacts:
    driver: local
  neuromove_logs:
    driver: local
  neuromove_mlruns:
    driver: local
  neuromove_postgres:
    driver: local
  neuromove_redis:
    driver: local
  neuromove_prometheus:
    driver: local
  neuromove_grafana:
    driver: local
  neuromove_alertmanager:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  neuromove-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16