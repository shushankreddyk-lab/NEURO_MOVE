global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'neuromove-enterprise'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'rules/*.yml'

scrape_configs:
  - job_name: 'neuromove-api'
    static_configs:
      - targets: ['neuromove-api:8000']
    metrics_path: '/metrics/prometheus'
    scrape_interval: 10s

  - job_name: 'neuromove-training'
    static_configs:
      - targets: ['neuromove-training:9090']
    scrape_interval: 30s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']