[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromove-archive"
version = "1.0.0"
description = "NeuroMove Enterprise MI-BCI Archive - Unified Implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
]
gpu = [
    "torch>=2.0.0",
]
full = [
    "mne>=1.5.0",
    "sktime>=0.24.0",
    "scikit-learn>=1.3.0,<1.9.0",
    "scipy>=1.10.0,<1.19.0",
    "numpy>=1.24.0,<2.6.0",
    "pandas>=2.0.0,<3.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.28.0",
    "streamlit-option-menu>=0.3.0",
    "streamlit-lottie>=0.0.3",
    "plotly>=5.0.0",
    "Pillow>=9.0.0",
    "joblib>=1.3.0",
    "numba>=0.59.0",
    "edfio>=0.4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # assert (used in tests)
    "T201",  # print (allowed in scripts)
]
exclude = [
    ".venv",
    "__pycache__",
    "*.npz",
    "*.pkl",
    "*.pth",
    "datasets/",
    "models/",
    "artifacts/",
    "reports/",
]
fixable = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src"]
import-headings = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/dashboard/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit-hooks]
# Configured in .pre-commit-config.yaml