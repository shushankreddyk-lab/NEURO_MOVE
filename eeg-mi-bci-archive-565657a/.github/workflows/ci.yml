name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NEUROMOVE_ROOT: ${{ github.workspace }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      
      - name: Install ruff
        run: pip install ruff
      
      - name: Run ruff check
        run: ruff check .
      
      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      
      - name: Install dependencies
        run: |
          pip install -e .[dev,full]
      
      - name: Run pytest
        run: pytest --tb=short -q
        env:
          NEUROMOVE_ROOT: ${{ github.workspace }}

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      
      - name: Install dependencies
        run: |
          pip install -e .[full]
      
      - name: Verify imports
        run: |
          python -c "
          from src.minirocket_engine import MiniRocketPipeline
          from src.eegnet_engine import EEGNet_Pipeline
          from src.cnn_lstm_engine import CNN_LSTM_Pipeline
          from src.convnets_engine import ConvNet_Pipeline
          from src.advanced_eeg_engine import AdvancedEEGPipeline
          from src.config_loader import get_config
          from src.model_registry import ModelRegistry
          print('✅ All imports successful')
          "
        env:
          NEUROMOVE_ROOT: ${{ github.workspace }}
      
      - name: Verify config loads
        run: |
          python -c "
          from src.config_loader import get_config
          cfg = get_config()
          assert cfg['minirocket.num_kernels'] == 10000
          assert cfg['preprocessing.sfreq'] == 160
          print('✅ Config loaded correctly')
          "
        env:
          NEUROMOVE_ROOT: ${{ github.workspace }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: neuromove-archive:latest
          load: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true