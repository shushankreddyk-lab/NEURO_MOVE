name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run ruff lint
        run: ruff check eeg-mi-bci scripts neuro-move-release/backend

      - name: Run ruff format check
        run: ruff format --check eeg-mi-bci scripts neuro-move-release/backend

      - name: Run pytest
        run: pytest tests/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: neuro-move-release/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: neuro-move-release/frontend
        run: npm install

      - name: Run frontend lint
        working-directory: neuro-move-release/frontend
        run: npm run lint 2>/dev/null || echo "oxlint not available, skipping"

      - name: Run frontend build
        working-directory: neuro-move-release/frontend
        run: npm run build
